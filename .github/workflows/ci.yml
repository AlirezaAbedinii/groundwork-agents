name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5433/rag
    defaults:
      run:
        working-directory: services/rag
    services:
      postgres:
        # The chunk store; same image as services/rag/docker-compose.yml.
        image: pgvector/pgvector:0.8.1-pg16-trixie
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/rag/pyproject.toml

      - name: Install (editable + dev tools + lightweight extras)
        # ingestion (pypdf/bs4/markdown-it), api (fastapi/uvicorn) and indexing
        # (psycopg/pgvector/rank-bm25) are light, so the loader, API and store
        # tests all run in CI. The heavy ML stack (torch) stays out of CI.
        run: python -m pip install -e ".[dev,ingestion,api,indexing]"

      - name: Wait for Postgres
        # Hard gate: the pg tests skip when DATABASE_URL is unreachable, which
        # would otherwise look like a green run.
        run: |
          python - <<'PY'
          import os, sys, time
          import psycopg

          deadline = time.monotonic() + 120
          while True:
              try:
                  psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=3).close()
                  print("postgres is reachable")
                  break
              except Exception as exc:
                  if time.monotonic() > deadline:
                      sys.exit(f"postgres not ready: {exc!r}")
                  time.sleep(3)
          PY

      - name: Lint (ruff)
        run: make lint

      - name: Test (pytest)
        run: make test

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (dependencies + dev tools; the project is not a package)
        run: |
          python -m pip install uv
          uv pip install --system -r pyproject.toml --extra dev

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test (pytest; the RAG API is faked, no services or keys)
        run: python -m pytest -q

  agent-unit:
    runs-on: ubuntu-latest
    env:
      # Never call real providers from CI; tests replay recorded fixtures.
      MOCK_LLM: "1"
      # code_exec runs in an isolated subprocess (no Docker socket on the runner).
      CODE_EXEC_BACKEND: subprocess
    defaults:
      run:
        # Agent paths (fixtures, alembic.ini, .env) are resolved from the CWD.
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (editable + dev tools)
        run: |
          python -m pip install uv
          uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests (in-process; no postgres/redis/chroma services)
        run: python -m pytest tests/unit -q -m "not live"

  agent-integration:
    # Real postgres/redis/chroma as service containers; the LLM stays mocked.
    # Runs only after lint + unit pass so a red unit run doesn't spend containers.
    needs: agent-unit
    runs-on: ubuntu-latest
    env:
      MOCK_LLM: "1"
      CODE_EXEC_BACKEND: subprocess
      DATABASE_URL: postgresql+psycopg://orchestrator:orchestrator@localhost:5432/orchestrator
      REDIS_URL: redis://localhost:6379/0
      CHROMA_HOST: localhost
      CHROMA_PORT: "8010"
    defaults:
      run:
        working-directory: services/agent
    services:
      postgres:
        # pgvector: migration 0007 creates the vector extension for memories.
        image: pgvector/pgvector:0.8.1-pg16-trixie
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestrator"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      chromadb:
        # Same digest as services/agent/docker-compose.yml (chroma 1.4.4). The
        # image has no curl, so readiness is checked from the job below rather
        # than via --health-cmd.
        image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
        ports:
          - 8010:8000
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (editable + dev tools)
        run: |
          python -m pip install uv
          uv pip install --system -e ".[dev]"

      - name: Wait for services
        # Hard gate: the integration conftest skips the whole suite when postgres
        # is unreachable, which would otherwise look like a green run.
        run: |
          python - <<'PY'
          import sys, time
          import psycopg, redis

          def probe():
              psycopg.connect("postgresql://orchestrator:orchestrator@localhost:5432/orchestrator").close()
              redis.Redis.from_url("redis://localhost:6379/0").ping()

          deadline = time.monotonic() + 120
          while True:
              try:
                  probe()
                  print("postgres and redis are reachable")
                  break
              except Exception as exc:
                  if time.monotonic() > deadline:
                      sys.exit(f"services not ready: {exc!r}")
                  time.sleep(3)
          PY

      - name: Integration and e2e tests (mock LLM against real services)
        # Both suites share the conftest contract (migrate, seed, truncate
        # between tests) and need only the three service containers.
        run: python -m pytest tests/integration tests/e2e -q -m "not live" -rs
