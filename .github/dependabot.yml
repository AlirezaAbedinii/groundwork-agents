version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Each service keeps its own pyproject.toml, so Dependabot needs one entry
  # per service. One PR for routine minor/patch bumps; majors still come individually.
  - package-ecosystem: pip
    directory: /services/rag
    # The image's reranker stack stays at the versions the published scores and the
    # calibrated hybrid threshold were measured with; it moves only with a re-check.
    exclude-paths:
      - docker/constraints.txt
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/agent
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
