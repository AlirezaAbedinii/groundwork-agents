version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Each service keeps its own pyproject.toml, so Dependabot needs one entry
  # per service. One PR for routine minor/patch bumps; majors still come individually.
  - package-ecosystem: pip
    directory: /services/rag
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/agent
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
