# Full stack: API + Postgres with pgvector + Streamlit UI + the MCP server
# (+ one-off seeder).
#
# The chunks live in Postgres (`db`, host port 5433, volume ragdb); ./data is
# bind-mounted so the files the service keeps on disk survive restarts and
# match what the host sees.
#
# Quickstart (zero manual steps beyond an API key in .env):
#   cp .env.example .env                # set OPENAI_API_KEY
#   docker compose up -d --build        # API :8000, UI :8501, MCP :8001/mcp, db :5433
#   docker compose run --rm seed        # index the sample corpus
#   open http://localhost:8501          # or curl the API (see README)
services:
  db:
    image: pgvector/pgvector:0.8.1-pg16-trixie
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - ragdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      RAG_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  # The retrieval tools (search, ask, list_sources) over MCP, built from ../../mcp.
  # Agents connect to http://localhost:8001/mcp from the host.
  mcp:
    build: ../../mcp
    environment:
      RAG_API_URL: http://api:8000
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # A TCP connect from inside the container: the host's port mapping accepts
      # connections before the server is up, this doesn't.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-off: `docker compose run --rm seed` indexes the sample corpus.
  seed:
    build: .
    profiles: ["seed"]
    command: python scripts/seed.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  ragdb:
