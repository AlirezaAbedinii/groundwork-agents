version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps; majors still come individually.
      python-minor-and-patch:
        update-types: ["minor", "patch"]
