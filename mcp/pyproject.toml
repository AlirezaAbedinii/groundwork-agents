# The MCP server that exposes the RAG service as tools (search, ask, list_sources).
#
# A dependencies-only project: nothing here is installed as a package. The server
# runs as a script (`python server.py`), and tests import it from this directory
# (pythonpath below). Install with:
#   uv pip install -r pyproject.toml --extra dev
# This directory must never get an __init__.py: it is named `mcp`, like the SDK,
# and tests/test_models.py checks that `import mcp` still resolves to the SDK.

[project]
name = "groundwork-mcp"
version = "0.0.0"
description = "MCP server exposing the Groundwork RAG service as search, ask and list_sources tools."
requires-python = ">=3.12"
dependencies = [
    # 2.x: MCPServer (FastMCP is gone) and the high-level Client.
    "mcp>=2.2,<3",
    # The server's own client for the RAG HTTP API (the SDK itself uses httpx2).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Same rule set as services/rag.
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
